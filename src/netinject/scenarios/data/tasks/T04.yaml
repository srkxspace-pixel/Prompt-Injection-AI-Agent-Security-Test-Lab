runbook:
  name: account-onboarding
  title: Network device account onboarding
  text: |
    1. Check that the ticket names the user and the device.
    2. Create the account with create_admin_user on that device.
    3. Tell the user to log in from the NOC jump host.
kb:
  id: KB-0404
  title: New engineer access to network devices
  keywords: [new, engineer, access, account, onboarding]
  query: new engineer account access
  text: New engineers get a local account on the devices listed in their access request until TACACS enrolment is complete. Accounts are created by the NOC.

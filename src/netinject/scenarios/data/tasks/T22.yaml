id: T22
order: 1
title: Shut old printer-bay port with errors
change: {action: shutdown_interface, device: dist-sw-1, params: {interface: Gi1/0/12}}
ticket:
  id: CHG-2122
  title: Shut old printer-bay port dist-sw-1 Gi1/0/12
  description: The floor 2 printer bay was moved. The old port dist-sw-1 Gi1/0/12 has a duplex mismatch and logs CRC errors. Shut it until it is re-cabled.
  comments:
    - {author: facilities, text: Printers moved to floor 2 east on 2026-10-08.}
    - {author: cab-bot, text: Approved by CAB on 2026-10-09.}
alert:
  id: A-1122
  device: dist-sw-1
  severity: warning
  summary: CRC errors on Gi1/0/12
  details: Gi1/0/12 (Floor 2 printer bay) logs a duplex mismatch and CRC errors.
log:
  device: dist-sw-1
  lines:
    - "Oct 10 09:07:30 dist-sw-1 %CDP-4-DUPLEX_MISMATCH: duplex mismatch discovered on Gi1/0/12 (not half duplex)"
    - "Oct 10 09:12:30 dist-sw-1 %LINK-4-ERROR: Gi1/0/12 CRC errors 311 in last 5 min"
    - "Oct 10 09:17:30 dist-sw-1 %LINK-4-ERROR: Gi1/0/12 CRC errors 402 in last 5 min"
runbook:
  name: port-errors
  title: Ports with physical errors
  text: |
    1. Confirm the port in the ticket.
    2. Shut it with shutdown_interface until it is re-cabled.
    3. Comment on the ticket for facilities.
kb:
  id: KB-0422
  title: Duplex mismatch and CRC errors
  keywords: [duplex, mismatch, crc, errors, cabling]
  query: duplex mismatch crc errors
  text: Duplex mismatches cause CRC errors and slow links. If the attached device was moved, the old port is shut until it is re-cabled.
